<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Subtitles</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 14px 14px 24px; font: 13px system-ui, sans-serif; background: #16181d; color: #e8e8ea; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  h2 { font-size: 13px; margin: 18px 0 8px; color: #cfd2da; }
  .tabs, .seg { display: flex; gap: 4px; background: #20232b; padding: 3px; border-radius: 9px; }
  .tabs { margin-bottom: 12px; }
  .tabs button, .seg button { flex: 1; margin: 0; padding: 7px 4px; font-size: 12.5px; font-weight: 600; background: transparent; color: #a9adb8; border-radius: 7px; }
  .tabs button.on, .seg button.on { background: #2f3542; color: #fff; }
  label { display: block; margin: 10px 0 4px; color: #a9adb8; font-size: 12px; }
  select, input[type=password] { width: 100%; box-sizing: border-box; padding: 7px; border-radius: 6px; border: 1px solid #333844; background: #20232b; color: #e8e8ea; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .row label { margin: 0; color: #e8e8ea; }
  button { width: 100%; margin-top: 14px; padding: 10px; border: 0; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; background: #4f7cff; color: white; }
  button:hover { filter: brightness(1.1); }
  button.stop { background: #e5484d; }
  button.alt { background: #2a2f3a; color: #e8e8ea; }
  #status { margin-top: 10px; min-height: 16px; font-size: 12px; color: #a9adb8; line-height: 1.45; }
  #status.err { color: #ff8589; }
  a { color: #7fa0ff; }
  .hint { font-size: 11.5px; color: #8b909c; margin-top: 6px; line-height: 1.45; }
  [hidden] { display: none !important; }
  .card { margin-top: 12px; border: 1px solid #2c303a; border-radius: 9px; padding: 10px; background: #1a1d23; }

  /* subtitle file */
  #dropZone { margin-top: 4px; border: 1.5px dashed #3a4050; border-radius: 9px; padding: 14px 10px; text-align: center; color: #a9adb8; }
  #dropZone.over { border-color: #4f7cff; background: #1d2333; }
  #dropZone button { margin-top: 0; }
  .fileHead { display: flex; align-items: center; gap: 8px; }
  .fileHead .name { flex: 1; min-width: 0; word-break: break-all; color: #7fd4a0; font-weight: 600; }
  .fileHead button { width: auto; margin: 0; padding: 4px 8px; font-size: 12px; }
  .ctl { display: flex; align-items: center; gap: 4px; }
  .ctl button { flex: none; width: auto; margin: 0; padding: 6px 8px; font-size: 12px; background: #2a2f3a; color: #e8e8ea; border-radius: 6px; }
  .ctl button:hover { background: #363c4a; }
  .off { flex: 1; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cue { flex: 1; min-width: 0; padding: 6px 8px; background: #20232b; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #syncNow { margin-top: 8px; padding: 8px; font-size: 13px; }

  /* style editor */
  #preview { margin-top: 10px; height: 92px; border-radius: 7px; position: relative; overflow: hidden;
             background: linear-gradient(135deg, #3b5b7a, #7a6a4f 55%, #2f4a3a); }
  #previewInner { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; width: 92%; }
  input[type=range] { width: 100%; accent-color: #4f7cff; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  input[type=color] { width: 100%; height: 30px; padding: 2px; border: 1px solid #333844; border-radius: 6px; background: #20232b; cursor: pointer; }
  .swatches { display: flex; gap: 6px; margin-top: 7px; }
  .swatches span { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid #333844; }
  .presets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .presets button { width: auto; flex: 1; margin: 0; padding: 6px 4px; font-size: 11.5px; font-weight: 600; background: #2a2f3a; color: #e8e8ea; border-radius: 6px; }
  .presets button:hover { background: #363c4a; }
</style>
</head>
<body>
  <h1>🎬 Live Subtitles</h1>

  <div class="tabs">
    <button id="tabLive" class="on">🎧 Live (AI)</button>
    <button id="tabFile">📄 Subtitle file</button>
  </div>

  <!-- ============ Live (AI) ============ -->
  <section id="live">
    <label for="provider">Speech engine</label>
    <select id="provider">
      <option value="groq">Groq Whisper (free tier, fast)</option>
      <option value="openai">OpenAI Whisper</option>
    </select>

    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" placeholder="Paste your API key">
    <div class="hint" id="keyHint">Free key: <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a></div>

    <label for="sourceLang">Video language</label>
    <select id="sourceLang"><option value="auto">Detect automatically</option></select>

    <button id="toggle">Start subtitles on this tab</button>
    <div id="muteRow" hidden>
      <div class="row"><input type="checkbox" id="liveMute"><label for="liveMute">🔇 Mute the video's sound (subtitles keep going)</label></div>
      <div class="hint">Muting or turning down the player works too: subtitles keep going either way.</div>
    </div>
  </section>

  <!-- ============ Subtitle file ============ -->
  <section id="file" hidden>
    <div id="dropZone">
      <button id="pickFile">Choose subtitle file…</button>
      <input id="fileInput" type="file" accept=".srt,.vtt,.ass,.ssa,.txt" hidden>
      <div class="hint">or drop a .srt / .vtt / .ass file here or onto the video</div>
    </div>

    <div id="loaded" class="card" hidden>
      <div class="fileHead">
        <span class="name" id="fileName"></span>
        <button class="alt" id="removeFile" title="Remove the subtitles from this tab">✕ Remove</button>
      </div>

      <label>Delay <span class="hint">(on the page: G earlier · H later · Shift = 1s)</span></label>
      <div class="ctl">
        <button data-d="-1">−1s</button><button data-d="-0.1">−0.1</button>
        <span class="off" id="offset">0.0s</span>
        <button data-d="0.1">+0.1</button><button data-d="1">+1s</button>
        <button id="resetDelay" title="Reset delay">↺</button>
      </div>

      <label>Quick sync: pick a line, press the button when you hear it</label>
      <div class="ctl">
        <button id="prevCue" title="Previous line">◀</button>
        <div class="cue" id="cueText">…</div>
        <button id="nextCue" title="Next line">▶</button>
      </div>
      <button class="alt" id="syncNow">🎯 This line is being said now</button>

      <div class="row"><input type="checkbox" id="hideSubs"><label for="hideSubs">Hide subtitles</label></div>

      <label for="encoding">Text encoding <span class="hint">(change if letters look broken)</span></label>
      <select id="encoding"></select>
    </div>
  </section>

  <!-- ============ shared ============ -->
  <label for="targetLang">Show subtitles in</label>
  <select id="targetLang"><option value="none">Same as original (no translation)</option></select>
  <div class="row">
    <input type="checkbox" id="showOriginal"><label for="showOriginal">Also show original text</label>
  </div>

  <div id="status"></div>

  <!-- ============ style ============ -->
  <h2>🎨 Subtitle style</h2>
  <div class="seg">
    <button id="styleForLive" class="on">🎧 AI subtitles</button>
    <button id="styleForFile">📄 File subtitles</button>
  </div>
  <div id="preview"><div id="previewInner"></div></div>

  <label for="fontSize">Size: <span id="fontSizeVal"></span>px</label>
  <input id="fontSize" type="range" min="12" max="60">

  <label for="position">Height from bottom: <span id="positionVal"></span>%</label>
  <input id="position" type="range" min="0" max="85">

  <label for="width">Max line width: <span id="widthVal"></span>%</label>
  <input id="width" type="range" min="40" max="100">

  <div class="grid">
    <div><label for="textColor">Text color</label><input id="textColor" type="color"></div>
    <div><label for="bgColor">Background</label><input id="bgColor" type="color"></div>
    <div><label for="origColor">Original line</label><input id="origColor" type="color"></div>
  </div>
  <div class="swatches" id="swatches" title="Quick text colors"></div>

  <label for="bgOpacity">Background opacity: <span id="bgOpacityVal"></span>%</label>
  <input id="bgOpacity" type="range" min="0" max="100">

  <div class="grid2">
    <div><label for="fontFamily">Font</label>
      <select id="fontFamily">
        <option value="system">System default</option>
        <option value="arial">Arial</option>
        <option value="tahoma">Tahoma</option>
        <option value="verdana">Verdana</option>
        <option value="trebuchet">Trebuchet</option>
        <option value="georgia">Georgia</option>
        <option value="times">Times New Roman</option>
        <option value="arabic">Arabic (Naskh)</option>
        <option value="mono">Monospace</option>
      </select></div>
    <div><label for="edge">Text edge</label>
      <select id="edge">
        <option value="none">None</option>
        <option value="shadow">Shadow</option>
        <option value="outline">Outline</option>
        <option value="both">Outline + shadow</option>
      </select></div>
  </div>
  <div class="row"><input type="checkbox" id="bold"><label for="bold">Bold text</label></div>

  <div class="presets">
    <button data-preset="classic">Classic</button>
    <button data-preset="yellow">Yellow</button>
    <button data-preset="clean">No box</button>
    <button data-preset="big">Large</button>
    <button id="resetStyle">Reset</button>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
